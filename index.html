<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🛺 توك توك كفر الدوار - 3D FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    color: #fff;
  }

  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* واجهة اللعب */
  #hud {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    background: rgba(0,0,0,0.75);
    padding: 15px 40px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,200,0,0.4);
    pointer-events: none;
    z-index: 100;
  }

  .hud-item {
    text-align: center;
  }

  .hud-label {
    font-size: 11px;
    color: #ffc800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 24px;
    font-weight: bold;
    margin-top: 4px;
  }

  #missionText {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 16px;
    border-right: 5px solid #ffc800;
    backdrop-filter: blur(10px);
    z-index: 100;
    white-space: nowrap;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    pointer-events: none;
    z-index: 50;
  }

  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.5);
  }

  #crosshair::before {
    width: 2px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
  }

  #crosshair::after {
    height: 2px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
  }

  /* شاشة البداية */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 50%, #0a0a2e 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .overlay h1 {
    font-size: 52px;
    color: #ffc800;
    text-shadow: 0 0 30px rgba(255,200,0,0.5), 0 4px 0 #8a6d00;
    margin-bottom: 15px;
  }

  .overlay p {
    font-size: 18px;
    color: #aaa;
    margin-bottom: 10px;
    text-align: center;
    max-width: 500px;
    line-height: 1.8;
  }

  .overlay button {
    margin-top: 30px;
    padding: 18px 60px;
    background: linear-gradient(180deg, #ffd93d 0%, #ffc800 100%);
    border: none;
    border-radius: 50px;
    font-size: 22px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    box-shadow: 0 8px 0 #8a6d00, 0 12px 30px rgba(255,200,0,0.3);
    transition: all 0.15s;
  }

  .overlay button:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #8a6d00;
  }

  .loading-bar {
    width: 300px;
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-top: 20px;
    overflow: hidden;
  }

  .loading-fill {
    height: 100%;
    background: #ffc800;
    width: 0%;
    transition: width 0.3s;
  }

  #instructions {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 13px;
    text-align: center;
    z-index: 100;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- واجهة اللعب -->
<div id="hud" class="hidden">
  <div class="hud-item">
    <div class="hud-label">الفلوس</div>
    <div class="hud-value" id="money">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">التوصيلات</div>
    <div class="hud-value" id="deliveries">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">الوقت</div>
    <div class="hud-value" id="time">03:00</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">السرعة</div>
    <div class="hud-value" id="speed">0</div>
  </div>
</div>

<div id="missionText" class="hidden">جاري تحميل المدينة...</div>
<div id="crosshair" class="hidden"></div>
<div id="instructions" class="hidden">استخدم W A S D للحركة | الماوس للنظر</div>

<!-- شاشة البداية -->
<div class="overlay" id="startScreen">
  <h1>🛺 توك توك كفر الدوار</h1>
  <p>منظور الشخص الأول - 3D</p>
  <p style="color: #666; font-size: 14px;">الطريق الزراعي • ترعة المحمودية • شارع أحمد عرابي</p>
  <button id="startBtn">ابدأ الرحلة</button>
  <div class="loading-bar" id="loadingBar" style="display:none;">
    <div class="loading-fill" id="loadingFill"></div>
  </div>
</div>

<!-- تحميل Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ==========================================
// لعبة توك توك كفر الدوار - 3D FPS
// المرحلة 1: الإعداد الأساسي
// ==========================================

// ---- إعدادات عامة ----
const CONFIG = {
  citySize: 2000,        // حجم المدينة بالمتر
  canalWidth: 25,        // عرض ترعة المحمودية
  roadWidth: 24,         // عرض الشوارع الرئيسية
  sidewalkWidth: 3,      // عرض الرصيف
  playerHeight: 1.5,     // ارتفاع نظر السائق
  tukTukHeight: 1.2,     // ارتفاع التوك توك
  moveSpeed: 12,         // سرعة الحركة (متر/ثانية)
  lookSpeed: 0.002,      // سرعة النظر
};

// ---- المشهد ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // لون سماء
scene.fog = new THREE.Fog(0x87CEEB, 200, 800);

// ---- الكاميرا ----
const camera = new THREE.PerspectiveCamera(
  75,                                    // مجال الرؤية
  window.innerWidth / window.innerHeight, // نسبة العرض
  0.1,                                   // أقرب مسافة
  2000                                   // أبعد مسافة
);

// ---- المصير ----
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('gameCanvas'),
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

// ---- الإضاءة ----
// ضوء الشمس
const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
sunLight.position.set(100, 200, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 1000;
sunLight.shadow.camera.left = -300;
sunLight.shadow.camera.right = 300;
sunLight.shadow.camera.top = 300;
sunLight.shadow.camera.bottom = -300;
scene.add(sunLight);

// ضوء محيطي
const ambientLight = new THREE.AmbientLight(0x404060, 1.5);
scene.add(ambientLight);

// ضوء السماء
const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a3a3a, 1.0);
scene.add(hemiLight);

// ---- التحكم ----
const controls = new PointerLockControls(camera, renderer.domElement);

// إضافة الكاميرا للمشهد
scene.add(controls.getObject());

// ---- حالة اللاعب ----
const player = {
  position: new THREE.Vector3(800, CONFIG.playerHeight, 600),
  velocity: new THREE.Vector3(),
  direction: new THREE.Vector3(),
  speed: 0,
  maxSpeed: CONFIG.moveSpeed,
  acceleration: 25,
  friction: 8,
  angle: 0,
  targetAngle: 0,
  isLocked: false
};

// ---- المدخلات ----
const keys = {};

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// قفل الماوس
document.getElementById('startBtn').addEventListener('click', () => {
  controls.lock();
});

controls.addEventListener('lock', () => {
  player.isLocked = true;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('missionText').classList.remove('hidden');
  document.getElementById('crosshair').classList.remove('hidden');
  document.getElementById('instructions').classList.remove('hidden');
});

controls.addEventListener('unlock', () => {
  player.isLocked = false;
});

// ---- إنشاء الأرضية الأساسية ----
function createGround() {
  // الأرضية الخضراء (الزراعة المحيطة)
  const groundGeo = new THREE.PlaneGeometry(5000, 5000);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x4a7c3f,
    roughness: 1,
    metalness: 0
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // شبكة إرشادية (للتطوير)
  const gridHelper = new THREE.GridHelper(2000, 100, 0x000000, 0x222222);
  gridHelper.position.y = 0.01;
  gridHelper.material.opacity = 0.2;
  gridHelper.material.transparent = true;
  scene.add(gridHelper);

  return ground;
}

// ---- إنشاء ترعة المحمودية ----
function createCanal() {
  const canalGroup = new THREE.Group();

  // مياه الترعة
  const waterGeo = new THREE.PlaneGeometry(CONFIG.citySize, CONFIG.canalWidth);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x1a4a6a,
    roughness: 0.1,
    metalness: 0.8,
    transparent: true,
    opacity: 0.85
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -0.5;
  water.receiveShadow = true;
  canalGroup.add(water);

  // ضفاف الترعة
  const bankMat = new THREE.MeshStandardMaterial({
    color: 0x8b7355,
    roughness: 1
  });

  // الضفة الشمالية
  const northBankGeo = new THREE.BoxGeometry(CONFIG.citySize, 2, 4);
  const northBank = new THREE.Mesh(northBankGeo, bankMat);
  northBank.position.set(0, 1, -(CONFIG.canalWidth / 2 + 2));
  northBank.castShadow = true;
  northBank.receiveShadow = true;
  canalGroup.add(northBank);

  // الضفة الجنوبية
  const southBank = new THREE.Mesh(northBankGeo, bankMat);
  southBank.position.set(0, 1, (CONFIG.canalWidth / 2 + 2));
  southBank.castShadow = true;
  southBank.receiveShadow = true;
  canalGroup.add(southBank);

  // جسر أحمد عرابي (يمر فوق الترعة)
  const bridgeGeo = new THREE.BoxGeometry(30, 3, CONFIG.canalWidth + 20);
  const bridgeMat = new THREE.MeshStandardMaterial({
    color: 0x555555,
    roughness: 0.9
  });
  const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
  bridge.position.set(800, 2, 0);
  bridge.castShadow = true;
  bridge.receiveShadow = true;
  canalGroup.add(bridge);

  // درابزين الجسر
  const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.5 });
  for (let side = -1; side <= 1; side += 2) {
    const railGeo = new THREE.BoxGeometry(2, 1.2, CONFIG.canalWidth + 20);
    const rail = new THREE.Mesh(railGeo, railMat);
    rail.position.set(800 + (side * 14), 3.6, 0);
    rail.castShadow = true;
    canalGroup.add(rail);
  }

  scene.add(canalGroup);
  return canalGroup;
}

// ---- إنشاء الشوارع الرئيسية ----
function createRoads() {
  const roadGroup = new THREE.Group();

  const roadMat = new THREE.MeshStandardMaterial({
    color: 0x3a3a3a,
    roughness: 0.95,
    metalness: 0.05
  });

  const sidewalkMat = new THREE.MeshStandardMaterial({
    color: 0x999999,
    roughness: 1
  });

  // دالة مساعدة لإنشاء شارع
  function createRoad(x, z, width, length, rotation = 0) {
    const roadGeo = new THREE.BoxGeometry(width, 0.2, length);
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.position.set(x, 0.1, z);
    road.rotation.y = rotation;
    road.receiveShadow = true;
    roadGroup.add(road);

    return road;
  }

  // دالة مساعدة لإنشاء رصيف
  function createSidewalk(x, z, width, length, rotation = 0) {
    const sideGeo = new THREE.BoxGeometry(CONFIG.sidewalkWidth, 0.4, length);
    const sidewalk = new THREE.Mesh(sideGeo, sidewalkMat);
    sidewalk.position.set(x, 0.3, z);
    sidewalk.rotation.y = rotation;
    sidewalk.receiveShadow = true;
    sidewalk.castShadow = true;
    roadGroup.add(sidewalk);
    return sidewalk;
  }

  // === الشوارع الرئيسية ===

  // 1. شارع أحمد عرابي (الأهم - يمتد شرق-غرب على طول الترعة)
  // بطول 5155 متر وعرض 24 متر
  createRoad(0, -15, CONFIG.roadWidth, CONFIG.citySize);
  createSidewalk(-CONFIG.roadWidth/2 - CONFIG.sidewalkWidth/2, -15, CONFIG.sidewalkWidth, CONFIG.citySize);
  createSidewalk(CONFIG.roadWidth/2 + CONFIG.sidewalkWidth/2, -15, CONFIG.sidewalkWidth, CONFIG.citySize);

  // 2. شارع بورسعيد (جنوب الترعة)
  createRoad(0, 25, CONFIG.roadWidth * 0.8, CONFIG.citySize);
  createSidewalk(-CONFIG.roadWidth*0.4 - CONFIG.sidewalkWidth/2, 25, CONFIG.sidewalkWidth, CONFIG.citySize);
  createSidewalk(CONFIG.roadWidth*0.4 + CONFIG.sidewalkWidth/2, 25, CONFIG.sidewalkWidth, CONFIG.citySize);

  // 3. شارع الجيش (المدخل الجنوبي - شمال-جنوب)
  createRoad(300, 0, CONFIG.roadWidth * 0.8, 800, Math.PI / 2);
  createSidewalk(300 - CONFIG.roadWidth*0.4 - CONFIG.sidewalkWidth/2, 0, CONFIG.sidewalkWidth, 800, Math.PI / 2);
  createSidewalk(300 + CONFIG.roadWidth*0.4 + CONFIG.sidewalkWidth/2, 0, CONFIG.sidewalkWidth, 800, Math.PI / 2);

  // 4. شارع الجمهورية
  createRoad(-400, 0, CONFIG.roadWidth * 0.7, 700, Math.PI / 2);

  // 5. شارع الحدائق (جاري توسعته)
  createRoad(100, 400, CONFIG.roadWidth * 0.6, 600, Math.PI / 2);

  // 6. شارع سيدي عبد القادر (المدخل الغربي)
  createRoad(-700, 100, CONFIG.roadWidth * 0.7, 500, Math.PI / 2);

  // 7. شارع جلال الدسوقي
  createRoad(-150, 500, CONFIG.roadWidth * 0.6, 700, Math.PI / 2);

  // 8. شارع المحور
  createRoad(600, 400, CONFIG.roadWidth * 0.6, 500, Math.PI / 2);

  // === الشوارع الثانوية ===

  // شوارع عرضية
  createRoad(-800, -400, CONFIG.roadWidth * 0.5, 400);
  createRoad(-200, -500, CONFIG.roadWidth * 0.5, 300);
  createRoad(500, -300, CONFIG.roadWidth * 0.5, 400);
  createRoad(900, -500, CONFIG.roadWidth * 0.5, 300);

  // شوارع طولية
  createRoad(-600, 600, CONFIG.roadWidth * 0.5, 400, Math.PI / 2);
  createRoad(200, 700, CONFIG.roadWidth * 0.5, 300, Math.PI / 2);
  createRoad(700, 600, CONFIG.roadWidth * 0.5, 400, Math.PI / 2);

  // خطوط الشوارع (علامات الطريق)
  function addRoadMarkings() {
    const markMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

    // خطوط شارع أحمد عرابي
    for (let z = -900; z < 900; z += 20) {
      const markGeo = new THREE.BoxGeometry(0.3, 0.1, 8);
      const mark = new THREE.Mesh(markGeo, markMat);
      mark.position.set(0, 0.25, z);
      roadGroup.add(mark);
    }

    // خطوط شارع بورسعيد
    for (let z = -900; z < 900; z += 20) {
      const markGeo = new THREE.BoxGeometry(0.3, 0.1, 6);
      const mark = new THREE.Mesh(markGeo, markMat);
      mark.position.set(0, 0.25, z + 25);
      roadGroup.add(mark);
    }
  }

  addRoadMarkings();

  scene.add(roadGroup);
  return roadGroup;
}

// ---- إنشاء خط السكة الحديد ----
function createRailway() {
  const railGroup = new THREE.Group();

  // خط السكة الحديد (يمر بجانب الترعة)
  const railMat = new THREE.MeshStandardMaterial({
    color: 0x666666,
    metalness: 0.8,
    roughness: 0.4
  });

  // القضبان
  for (let side = -1; side <= 1; side += 2) {
    const railGeo = new THREE.BoxGeometry(0.15, 0.3, CONFIG.citySize);
    const rail = new THREE.Mesh(railGeo, railMat);
    rail.position.set(-200 + (side * 1.5), 0.5, 0);
    rail.castShadow = true;
    railGroup.add(rail);
  }

  // عوارض السكة
  const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a });
  for (let z = -900; z < 900; z += 2) {
    const sleeperGeo = new THREE.BoxGeometry(4, 0.2, 0.4);
    const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
    sleeper.position.set(-200, 0.35, z);
    sleeper.receiveShadow = true;
    railGroup.add(sleeper);
  }

  scene.add(railGroup);
  return railGroup;
}

// ---- إنشاء الكائنات البسيطة (للتجربة) ----
function createDebugObjects() {
  // صندوق في المنتصف للاختبار
  const boxGeo = new THREE.BoxGeometry(50, 20, 50);
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
  const box = new THREE.Mesh(boxGeo, boxMat);
  box.position.set(800, 10, 600);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);

  // عمود
  const poleGeo = new THREE.CylinderGeometry(0.5, 0.5, 10);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.5 });
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.set(850, 5, 650);
  pole.castShadow = true;
  scene.add(pole);
}

// ---- تحديث اللاعب ----
function updatePlayer(dt) {
  if (!player.isLocked) return;

  // اتجاه الحركة بناءً على الكاميرا
  const forward = new THREE.Vector3();
  const right = new THREE.Vector3();

  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  right.crossVectors(forward, camera.up).normalize();

  // حساب اتجاه الحركة المطلوب
  const moveDirection = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) moveDirection.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) moveDirection.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) moveDirection.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) moveDirection.sub(right);

  if (moveDirection.length() > 0) {
    moveDirection.normalize();
    player.velocity.addScaledVector(moveDirection, player.acceleration * dt);
  }

  // الاحتكاك
  player.velocity.multiplyScalar(1 - player.friction * dt);

  // تحديد السرعة القصوى
  if (player.velocity.length() > player.maxSpeed) {
    player.velocity.normalize().multiplyScalar(player.maxSpeed);
  }

  // تحديث الموقع
  const oldPosition = player.position.clone();
  player.position.addScaledVector(player.velocity, dt);

  // حدود المدينة
  const limit = CONFIG.citySize / 2 - 10;
  player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
  player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

  // منع الدخول في الترعة
  if (Math.abs(player.position.z) < CONFIG.canalWidth / 2 + 2 &&
      !(player.position.x > 785 && player.position.x < 815)) {
    player.position.copy(oldPosition);
    player.velocity.set(0, 0, 0);
  }

  // تحديث الكاميرا
  controls.getObject().position.copy(player.position);

  // اهتزاز بسيط عند الحركة
  const speed = player.velocity.length();
  if (speed > 0.5) {
    controls.getObject().position.y = CONFIG.playerHeight + Math.sin(Date.now() * 0.02) * 0.03 * speed;
  } else {
    controls.getObject().position.y = CONFIG.playerHeight;
  }
}

// ---- تحديث واجهة المستخدم ----
let timeLeft = 180; // 3 دقائق
let lastTime = performance.now();

function updateHUD() {
  document.getElementById('speed').textContent = Math.round(player.velocity.length() * 3.6);

  const minutes = Math.floor(timeLeft / 60);
  const seconds = Math.floor(timeLeft % 60);
  document.getElementById('time').textContent =
    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

// ---- حلقة اللعبة ----
function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // تحديث الوقت
  if (player.isLocked && timeLeft > 0) {
    timeLeft -= dt;
  }

  updatePlayer(dt);
  updateHUD();

  // تحديث ضوء الشمس ليتبع اللاعب
  sunLight.position.set(player.position.x + 100, 200, player.position.z + 50);
  sunLight.target.position.copy(player.position);
  sunLight.target.updateMatrixWorld();

  // موجات الترعة
  const waterMesh = scene.children.find(c => c.type === 'Group' && c.children.some(ch => ch.geometry?.type === 'PlaneGeometry'));
  if (waterMesh) {
    waterMesh.children.forEach(child => {
      if (child.geometry?.type === 'PlaneGeometry' && child.material?.transparent) {
        child.position.y = -0.5 + Math.sin(now * 0.001) * 0.1;
      }
    });
  }

  renderer.render(scene, camera);
}

// ---- الاستجابة لتغيير حجم الشاشة ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- التهيئة ----
function init() {
  console.log('🛺 توك توك كفر الدوار - جاري التحميل...');

  // إنشاء المدينة
  createGround();
  createCanal();
  createRoads();
  createRailway();
  createDebugObjects();

  // وضع اللاعب في نقطة البداية
  player.position.set(800, CONFIG.playerHeight, 600);
  camera.position.copy(player.position);

  // بدء الحلقة
  animate();

  console.log('✅ المدينة جاهزة!');
  console.log('📍 إحداثيات كفر الدوار الحقيقية: 31.1303°N, 30.1313°E');
}

// بدء اللعبة
init();
</script>
