<!doctype html>
<html lang="ar" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>توك توك كفر الدوار | Tuktuk Kafr El Dawar</title>
    <meta name="description" content="العب توك توك كفر الدوار مجاناً من المتصفح: سوق في شوارع كفر الدوار وبولضو، وصّل الزباين. موبايل وكمبيوتر من غير تحميل." />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#06141a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Lalezar&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <noscript>
      <h1>توك توك كفر الدوار</h1>
      <p>اللعبة محتاجة JavaScript تكون شغالة.</p>
    </noscript>
    <canvas id="renderCanvas" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="loading">
      <div class="loading-card">
        <div class="logo-ar">توك توك كفر الدوار</div>
        <div class="logo-en">TUKTUK KAFR EL DAWAR</div>
        <div class="checker"><div id="loading-fill"></div></div>
        <div id="loading-status" dir="rtl">بيدوّر الموتور…</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
    <script>
      (function () {
        function stuck(msg) {
          if (window.__booted) return;
          var s = document.getElementById("loading-status");
          if (!s) return;
          s.innerHTML = msg + ' · <button id="boot-retry" type="button">جرّب تاني · Retry</button>';
          s.classList.add("error");
          document.getElementById("boot-retry").onclick = function () { location.reload(); };
        }
        setTimeout(function () { stuck("اللعبة بتاخد وقت طويل تبدأ"); }, 45000);
      })();
    </script>
  </body>
</html>
